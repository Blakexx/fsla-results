# THE PUBLIC MIRROR. A push to the default branch publishes: .github/mirror/mirror.py writes HEAD's shipping files and
# refuses an export with an undeclared path, an agent file or a private-shaped string; the export is then committed as
# one snapshot on the public repository's main, on top of the snapshots before it, naming the commit it was taken
# from. See .github/mirror/README.md.
name: mirror-to-public

on:
  push:
    branches: [main, master]

concurrency:
  group: mirror-to-public
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export and tripwire
        run: python3 .github/mirror/mirror.py /tmp/export
      - name: Commit the export as a snapshot on the public mirror
        env:
          MIRROR_KEY: ${{ secrets.MIRROR_KEY }}
        run: |
          PUBLIC="$(python3 .github/mirror/mirror.py --public)"
          SOURCE="${GITHUB_REPOSITORY#*/}@${GITHUB_SHA::12}"
          mkdir -p ~/.ssh && echo "$MIRROR_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd /tmp/export
          git init -q -b main
          git config user.name  "Blake Bottum"
          git config user.email "blakebottum.research@gmail.com"
          git remote add public "git@github.com:${PUBLIC}.git"
          git fetch -q public main 2>/dev/null && git reset -q --soft FETCH_HEAD || true
          git add -A
          git diff --cached --quiet || git commit -q -m "snapshot $(date -u +%F) from ${SOURCE}"
          git push -q public main
